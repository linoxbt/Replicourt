<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560">
  <title>RepliCourt hero graphic — courthouse facade with scales of justice</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- courthouse facade: pediment + colonnade, monoline -->
  <g stroke="url(#fade)" stroke-width="2" fill="none" opacity="0.55">
    <polygon points="40,150 420,150 230,60"/>
    <line x1="20" y1="150" x2="440" y2="150"/>
    <line x1="30" y1="470" x2="430" y2="470"/>
    <line x1="30" y1="478" x2="430" y2="478"/>
    <line x1="70" y1="160" x2="70" y2="470"/>
    <line x1="130" y1="160" x2="130" y2="470"/>
    <line x1="190" y1="160" x2="190" y2="470"/>
    <line x1="270" y1="160" x2="270" y2="470"/>
    <line x1="330" y1="160" x2="330" y2="470"/>
    <line x1="390" y1="160" x2="390" y2="470"/>
  </g>

  <!-- rising confidence bars, tucked between the columns -->
  <g fill="#2dd4bf" opacity="0.5">
    <rect x="150" y="410" width="18" height="60"/>
    <rect x="221" y="380" width="18" height="90"/>
    <rect x="292" y="340" width="18" height="130"/>
  </g>

  <!-- scales of justice, floating above the facade -->
  <g stroke="#2dd4bf" stroke-width="2.5" fill="none">
    <line x1="230" y1="190" x2="230" y2="330" opacity="0.9"/>
    <line x1="150" y1="220" x2="310" y2="220" opacity="0.9"/>
    <circle cx="230" cy="185" r="6" fill="#2dd4bf"/>
    <!-- left pan -->
    <line x1="150" y1="220" x2="118" y2="280" opacity="0.7"/>
    <line x1="150" y1="220" x2="182" y2="280" opacity="0.7"/>
    <path d="M108,280 A42,20 0 0 0 192,280" opacity="0.85"/>
    <!-- right pan -->
    <line x1="310" y1="220" x2="278" y2="280" opacity="0.7"/>
    <line x1="310" y1="220" x2="342" y2="280" opacity="0.7"/>
    <path d="M268,280 A42,20 0 0 0 352,280" opacity="0.85"/>
    <!-- base -->
    <polygon points="196,330 264,330 284,360 176,360" opacity="0.6"/>
    <rect x="206" y="360" width="48" height="14" opacity="0.6"/>
  </g>
</svg>
